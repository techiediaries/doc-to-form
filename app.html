<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النماذج القانونية الديناميكية</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <div id="app">
            <header>
                <h1>النماذج القانونية</h1>
                <p id="form-count"></p>
            </header>
            
            <!-- View for the list of forms -->
            <div id="form-list-view">
                <ul id="form-list-container" class="form-list">
                    <!-- JS will populate this -->
                </ul>
            </div>

            <!-- View for a single selected form -->
            <div id="form-display-view" style="display: none;">
                <!-- JS will populate this -->
            </div>
        </div>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
