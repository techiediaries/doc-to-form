<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sample2</title>
<link rel="stylesheet" href="../static/style.css">
</head>
<body>
<div class="container">
  <h1 class="doc-title">sample2</h1>
  <form id="doc-form" autocomplete="off">
    <div class="doc-body">
<p class="doc-line" dir="rtl">اقرار باجراء الترميمات الضرورية أقر انا ...."المؤجر" بأن الترميمات التى تتطلب اصلاح تنحصر فى <input type="text" id="f1" name="f1" class="field"> التزم بالقيام بها فى خلال اسبوعين من تاريخه ، و</p>
    </div>
    <div class="actions">
      <button type="button" onclick="exportForm('sample2')">تصدير كنص</button>
      <button type="button" onclick="window.print()">طباعة</button>
      <a href="../index.html">← العودة للقائمة</a>
    </div>
  </form>
</div>
<script>
const fields = [{"id": "f1", "type": "text", "label": ""}];

function exportForm(name) {
  let out = '';
  fields.forEach(f => {
    const el = document.getElementById(f.id);
    const val = el ? el.value : '';
    out += (f.label || f.id) + ': ' + val + '\n';
  });
  const blob = new Blob([out], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '-filled.txt';
  a.click();
}
</script>
</body>
</html>
